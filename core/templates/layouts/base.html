{% load static %}
<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>{% block title %}{% endblock %}</title>
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="{% static 'css/global.css' %}" />
        {% block style %}{% endblock %}
    </head>
    <body>
        {% if user.is_authenticated %}
            <div class="container-fluid">
                <div class="row">
                    <div class="col-12 text-end mt-3 me-3">
                        <div class="dropdown">
                            <button class="btn btn-secondary dropdown-toggle" type="button" id="userMenu" data-bs-toggle="dropdown" aria-expanded="false">
                                <i class="bi bi-person-circle"></i>
                            </button>
                            <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userMenu">
                                <li><span class="dropdown-item-text">{{ user.username }} - {{ user.first_name }} {{ user.last_name }}</span></li>
                                <li><a class="dropdown-item" href="{% url 'update_user_info' user.id %}">Cambiar Contraseña</a></li>
                                <li><hr class="dropdown-divider"></li>
                                <li><a class="dropdown-item text-danger" href="{% url 'logout' %}">Salir</a></li>
                            </ul>
                        </div>
                    </div>
                </div>
            </div>
        {% endif %}

        {% block content %}{% endblock %}
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
        {% block script %}{% endblock %}
    </body>
</html>
