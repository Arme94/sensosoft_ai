{% extends 'layouts/content_base.html' %}
{% load static %}

{% block style_option %}
<link rel="stylesheet" href="{% static 'css/panel.css' %}" />
{% endblock %}

{% block content_option %}
<div class="container-fluid">
    <h1 class="text-center">Análisis Sensorial de Cervezas</h1>

    <!-- Contenedor de campos de entrada -->
    <div class="inputs-container">
        <select id="inputName">
            <option value="" disabled selected>Nombre de la Cerveza</option>
            <option value="carmesi">Carmesi</option>
            <option value="lecter">Lecter</option>
            <option value="sauer">Sauer</option>
            <option value="prendida">Prendida</option>
            <option value="tramadora">Tramadora</option>
            <option value="la 10">La 10</option>
        </select>
        <input type="number" id="inputAroma" placeholder="Aroma (0-5)" step="0.1" min="0" max="5">
        <input type="number" id="inputSabor" placeholder="Sabor (0-5)" step="0.1" min="0" max="5">
        <input type="number" id="inputColor" placeholder="Color (0-5)" step="0.1" min="0" max="5">
        <input type="number" id="inputTextura" placeholder="Textura (0-5)" step="0.1" min="0" max="5">
        <button id="saveData" disabled>Guardar Datos</button>
        <button id="downloadPdf">Exportar PDF</button>
    </div>

    <!-- Contenedor de botones de predicción y detección -->
    <div class="button-container">
        <button id="predictResults">Predicción de Resultados</button>
        <button id="detectAnomalies">Detección de Anomalías</button>
    </div>

    <!-- Contenedor de las gráficas -->
    <div class="chart-grid">
        <div class="chart-item">
            <canvas id="radarChart"></canvas>
        </div>
        <div class="chart-item">
            <canvas id="barChart"></canvas>
        </div>
        <div class="chart-item">
            <canvas id="lineChart"></canvas>
        </div>
        <div class="chart-item">
            <canvas id="pieChart"></canvas>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.4.0/jspdf.umd.min.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        let chartInstances = [];
        let currentData = {};

        function renderCharts(data) {
            currentData = data; // Save the current data for later use
            const chartConfigs = [
                { id: 'radarChart', type: 'radar', title: 'Radar Sensorial', datasets: getRadarDatasets(data) },
                { id: 'barChart', type: 'bar', title: 'Barras Promedio', datasets: getBarDataset(data) },
                { id: 'lineChart', type: 'line', title: 'Líneas Comparativas', datasets: getLineDatasets(data) },
                { id: 'pieChart', type: 'pie', title: 'Distribución Sensorial', datasets: getPieDataset(data) }
            ];

            // Destruir gráficos previos
            chartInstances.forEach(chart => chart.destroy());
            chartInstances = [];

            chartConfigs.forEach(config => {
                const ctx = document.getElementById(config.id).getContext('2d');
                chartInstances.push(
                    new Chart(ctx, {
                        type: config.type,
                        data: {
                            labels: data.labels,
                            datasets: config.datasets
                        },
                        options: {
                            responsive: true,
                            plugins: {
                                title: {
                                    display: true,
                                    text: config.title
                                }
                            }
                        }
                    })
                );
            });
        }

        function getRadarDatasets(data) {
            return [
                { label: 'Aroma', data: data.aroma, borderColor: 'rgba(255, 99, 132, 1)', backgroundColor: 'rgba(255, 99, 132, 0.2)' },
                { label: 'Sabor', data: data.flavor, borderColor: 'rgba(54, 162, 235, 1)', backgroundColor: 'rgba(54, 162, 235, 0.2)' },
                { label: 'Color', data: data.color, borderColor: 'rgba(75, 192, 192, 1)', backgroundColor: 'rgba(75, 192, 192, 0.2)' },
                { label: 'Textura', data: data.texture, borderColor: 'rgba(153, 102, 255, 1)', backgroundColor: 'rgba(153, 102, 255, 0.2)' }
            ];
        }

        function getBarDataset(data) {
            return [{
                label: 'Promedio',
                data: data.labels.map((_, i) => (data.aroma[i] + data.flavor[i] + data.color[i] + data.texture[i]) / 4),
                backgroundColor: ['rgba(255, 99, 132, 0.2)', 'rgba(54, 162, 235, 0.2)', 'rgba(255, 206, 86, 0.2)', 'rgba(75, 192, 192, 0.2)', 'rgba(153, 102, 255, 0.2)', 'rgba(255, 159, 64, 0.2)'],
                borderWidth: 1
            }];
        }

        function getLineDatasets(data) {
            return [
                { label: 'Aroma', data: data.aroma, borderColor: 'rgba(255, 99, 132, 1)', fill: false },
                { label: 'Sabor', data: data.flavor, borderColor: 'rgba(54, 162, 235, 1)', fill: false },
                { label: 'Color', data: data.color, borderColor: 'rgba(75, 192, 192, 1)', fill: false },
                { label: 'Textura', data: data.texture, borderColor: 'rgba(153, 102, 255, 1)', fill: false }
            ];
        }

        function getPieDataset(data) {
            return [{
                data: data.labels.map((_, i) => (data.aroma[i] + data.flavor[i] + data.color[i] + data.texture[i]) / 4),
                backgroundColor: ['rgba(255, 99, 132, 0.2)', 'rgba(54, 162, 235, 0.2)', 'rgba(255, 206, 86, 0.2)', 'rgba(75, 192, 192, 0.2)', 'rgba(153, 102, 255, 0.2)', 'rgba(255, 159, 64, 0.2)']
            }];
        }

        function average(array) {
            const sum = array.reduce((acc, val) => acc + val, 0);
            return sum / array.length;
        }

        // Fetch data from the backend
        const fetchData = async () => {
            try {
                const response = await fetch('/api/get-sensorial-data/');
                const data = await response.json();
                if (response.ok) {
                    renderCharts(data);
                } else {
                    console.error(`Error: ${data.error || 'Algo salió mal.'}`);
                }
            } catch (error) {
                console.error(`Error de conexión: ${error.message}`);
            }
        };

        // Call fetchData on page load
        fetchData();

        // Habilitar/deshabilitar el botón de guardar datos
        const inputs = document.querySelectorAll('#inputName, #inputAroma, #inputSabor, #inputColor, #inputTextura');
        inputs.forEach(input => {
            input.addEventListener('input', () => {
                const allFilled = Array.from(inputs).every(input => input.value.trim() !== '');
                document.getElementById('saveData').disabled = !allFilled;
            });
        });

        document.getElementById("downloadPdf").addEventListener("click", () => {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();

            // Título y texto "quemado"
            doc.setFontSize(18);
            doc.text('Informe de Análisis Sensorial de la Cerveza', 10, 10);
            doc.setFontSize(12);
            doc.text('El perfil sensorial muestra un excelente equilibrio en aroma y color, con oportunidades de mejora en sabor.', 10, 20);
            doc.text('Se recomienda ajustar el tiempo de fermentación para estabilizar el sabor.', 10, 30);
            doc.text('En general, el producto tiene un perfil atractivo para el consumidor.', 10, 40);

            // Valores de la Evaluación Sensorial
            doc.text(`Aroma: ${average(currentData.aroma).toFixed(2)}`, 10, 50);
            doc.text(`Sabor: ${average(currentData.flavor).toFixed(2)}`, 10, 60);
            doc.text(`Color: ${average(currentData.color).toFixed(2)}`, 10, 70);
            doc.text(`Textura: ${average(currentData.texture).toFixed(2)}`, 10, 80);

            // Añadir gráficos
            const addChartToPDF = (canvasId, x, y, width, height) => {
                const canvas = document.getElementById(canvasId);
                const imgData = canvas.toDataURL('image/png');
                doc.addImage(imgData, 'PNG', x, y, width, height);
            };

            addChartToPDF('radarChart', 10, 90, 90, 90);
            addChartToPDF('barChart', 110, 90, 90, 90);
            doc.addPage();
            addChartToPDF('lineChart', 10, 20, 90, 90);
            addChartToPDF('pieChart', 110, 20, 90, 90);

            // Guardar el PDF
            doc.save('Informe_Analisis_Sensorial.pdf');
        });

        document.getElementById("saveData").addEventListener("click", async () => {
            const name = document.getElementById('inputName').value;
            const aroma = parseFloat(document.getElementById('inputAroma').value);
            const flavor = parseFloat(document.getElementById('inputSabor').value);
            const color = parseFloat(document.getElementById('inputColor').value);
            const texture = parseFloat(document.getElementById('inputTextura').value);

            const data = { name, aroma, flavor, color, texture };

            try {
                const response = await fetch('/api/save-sensorial-data/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data),
                });
                const result = await response.json();
                if (response.ok) {
                    alert('Datos guardados correctamente');
                    fetchData(); // Refresh the charts with the new data
                    // Clear the input fields
                    document.getElementById('inputName').value = '';
                    document.getElementById('inputAroma').value = '';
                    document.getElementById('inputSabor').value = '';
                    document.getElementById('inputColor').value = '';
                    document.getElementById('inputTextura').value = '';
                    document.getElementById('saveData').disabled = true; // Disable the button again
                } else {
                    alert(`Error: ${result.error || 'Algo salió mal.'}`);
                }
            } catch (error) {
                alert(`Error de conexión: ${error.message}`);
            }
        });
    });
</script>
{% endblock %}
